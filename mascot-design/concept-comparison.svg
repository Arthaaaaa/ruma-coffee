    <text x="195" y="432" text-anchor="middle" fill="#38261E" font-family="Arial, sans-serif" font-size="25" font-weight="700">03 · Good Company</text>
    <text x="195" y="468" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="16">The curious companion</text>
    <text x="195" y="510" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">A taller, off-center bean with</text>
    <text x="195" y="532" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">a looping groove and lively gaze.</text>
  </g>
