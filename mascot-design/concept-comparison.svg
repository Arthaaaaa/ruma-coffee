    </g>
    <text x="195" y="432" text-anchor="middle" fill="#38261E" font-family="Arial, sans-serif" font-size="25" font-weight="700">01 · Welcome Bean</text>
    <text x="195" y="468" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="16">The familiar friend</text>
    <text x="195" y="510" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">A clear bean shape with a gently</text>
    <text x="195" y="532" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">curving, shelter-like groove.</text>
  </g>
  <g transform="translate(585 96)">
    <rect width="390" height="560" rx="20" fill="#FBF8F2"/>
    <g transform="translate(0 12) scale(.76) translate(55 0)">
