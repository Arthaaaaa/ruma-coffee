      <g><ellipse cx="174" cy="259" rx="23" ry="30" fill="#F5EBDD"/><ellipse cx="321" cy="256" rx="23" ry="30" fill="#F5EBDD"/><ellipse cx="181" cy="264" rx="12" ry="19" fill="#281A15"/><ellipse cx="326" cy="261" rx="12" ry="19" fill="#281A15"/><circle cx="185" cy="255" r="5" fill="#F5EBDD"/><circle cx="330" cy="252" r="5" fill="#F5EBDD"/></g>
