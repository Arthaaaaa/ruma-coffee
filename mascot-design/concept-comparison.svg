<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 720" role="img" aria-labelledby="title desc">
  <title id="title">Ruma Coffee mascot concepts</title>
  <desc id="desc">Three coffee-bean mascot concepts compared side by side: Welcome Bean, The Nook, and Good Company.</desc>
  <rect width="1560" height="720" fill="#F2EADF"/>
  <text x="780" y="72" text-anchor="middle" fill="#38261E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">RUMA COFFEE · MASCOT STUDIES</text>
