      <g fill="none" stroke="#2D1B16" stroke-width="9" stroke-linecap="round"><path d="M158 225q22-20 48-7"/><path d="M300 215q24-12 45 7"/></g>
      <g><ellipse cx="183" cy="260" rx="24" ry="31" fill="#F5EBDD"/><ellipse cx="322" cy="260" rx="24" ry="31" fill="#F5EBDD"/><ellipse cx="189" cy="264" rx="13" ry="19" fill="#2D1B16"/><ellipse cx="316" cy="264" rx="13" ry="19" fill="#2D1B16"/><circle cx="193" cy="255" r="5" fill="#F5EBDD"/><circle cx="320" cy="255" r="5" fill="#F5EBDD"/></g>
