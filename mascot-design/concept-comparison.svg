    <text x="195" y="432" text-anchor="middle" fill="#38261E" font-family="Arial, sans-serif" font-size="25" font-weight="700">02 · The Nook</text>
    <text x="195" y="468" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="16">The comfortable regular</text>
    <text x="195" y="510" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">A wide, grounded bean with a</text>
    <text x="195" y="532" text-anchor="middle" fill="#66564B" font-family="Arial, sans-serif" font-size="14">groove that settles like a nook.</text>
  </g>
