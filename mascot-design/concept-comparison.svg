      <g fill="none" stroke="#2D1B16" stroke-width="10" stroke-linecap="round"><path d="M135 225q30-24 60-5"/><path d="M304 220q30-19 60 4"/></g>
      <g><ellipse cx="174" cy="264" rx="27" ry="34" fill="#F5EBDD"/><ellipse cx="337" cy="264" rx="27" ry="34" fill="#F5EBDD"/><ellipse cx="182" cy="269" rx="14" ry="21" fill="#2D1B16"/><ellipse cx="329" cy="269" rx="14" ry="21" fill="#2D1B16"/><circle cx="187" cy="259" r="5" fill="#F5EBDD"/><circle cx="334" cy="259" r="5" fill="#F5EBDD"/></g>
