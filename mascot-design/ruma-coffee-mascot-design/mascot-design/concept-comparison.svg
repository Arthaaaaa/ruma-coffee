  <text x="72" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-weight="normal" letter-spacing="-1.2">Three ways to feel at home</text>
  <text x="74" y="169" font-size="18" fill="#77675A">Three distinct bean silhouettes. One shared promise: you can slow down here.</text>
