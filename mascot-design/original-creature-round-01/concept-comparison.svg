    <text x="34" y="460" fill="#9A7135" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">C · UNEXPECTED &amp; ICONIC</text>
    <text x="34" y="501" fill="#382C25" font-family="Georgia, serif" font-size="32">Kasa — The Orbit</text>
    <text x="34" y="543" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">An open curl that makes a pocket of</text>
    <text x="34" y="568" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">space and holds a face inside it.</text>
    <text x="34" y="624" fill="#7A6454" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIGNATURE</text>
    <text x="34" y="648" fill="#382C25" font-family="Arial, sans-serif" font-size="15">A loose orbit that never closes shut.</text>
  </g>
  <text x="780" y="876" text-anchor="middle" fill="#806D5E" font-family="Arial, sans-serif" font-size="13">Provisional codenames · first concept round · no coffee, home, or heart symbols</text>
</svg>
