    <text x="34" y="460" fill="#557568" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">B · QUIRKY &amp; EXPRESSIVE</text>
    <text x="34" y="501" fill="#382C25" font-family="Georgia, serif" font-size="32">Tavi — The Tilt</text>
    <text x="34" y="543" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">A bright-eyed oddball, always the first</text>
    <text x="34" y="568" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">to notice something new in the room.</text>
    <text x="34" y="624" fill="#7A6454" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIGNATURE</text>
    <text x="34" y="648" fill="#382C25" font-family="Arial, sans-serif" font-size="15">A single swept crest and uneven gaze.</text>
  </g>
