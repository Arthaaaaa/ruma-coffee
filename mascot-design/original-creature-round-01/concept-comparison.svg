<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" role="img" aria-labelledby="title desc">
  <title id="title">Ruma Coffee original creature mascot directions</title>
  <desc id="desc">Three distinct original mascot directions: Muru, a soft folded creature; Tavi, a tall curious creature; and Kasa, a curled creature that holds a pocket of space.</desc>
  <rect width="1560" height="900" fill="#F1ECE2"/>
  <text x="780" y="64" text-anchor="middle" fill="#382C25" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">RUMA COFFEE  /  ORIGINAL CREATURE STUDIES</text>
  <text x="780" y="111" text-anchor="middle" fill="#382C25" font-family="Georgia, serif" font-size="38">A small presence. Room to be yourself.</text>
