      <path d="M166 239q21 17 42 0" fill="none" stroke="#382722" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="34" y="460" fill="#A95F43" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">A · SOFT &amp; ORGANIC</text>
    <text x="34" y="501" fill="#382C25" font-family="Georgia, serif" font-size="32">Muru — Open Fold</text>
    <text x="34" y="543" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">A gently lopsided companion with a</text>
    <text x="34" y="568" fill="#4F453D" font-family="Arial, sans-serif" font-size="17">fold that turns inward like a welcome.</text>
    <text x="34" y="624" fill="#7A6454" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIGNATURE</text>
    <text x="34" y="648" fill="#382C25" font-family="Arial, sans-serif" font-size="15">One shoulder curls softly across its body.</text>
  </g>
